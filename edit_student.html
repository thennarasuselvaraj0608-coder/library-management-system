{% extends "base.html" %}

{% block title %}Edit Student - Library Management System{% endblock %}
{% block page_title %}Update Student Record{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card">
                <div class="custom-card-header">
                    <h5><i class="bi bi-pencil-square text-primary"></i> Edit Student #{{ student.student_id }}</h5>
                    <a href="{{ url_for('list_students') }}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Students
                    </a>
                </div>
                <div class="custom-card-body p-4">
                    <form method="POST" action="{{ url_for('edit_student', student_id=student.student_id) }}" novalidate>
                        
                        <!-- Register Number & Full Name -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label for="register_number" class="form-label">Register / Roll Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control text-uppercase font-monospace" id="register_number" 
                                       name="register_number" required value="{{ student.register_number }}">
                            </div>
                            <div class="col-md-7">
                                <label for="student_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="student_name" name="student_name" required 
                                       value="{{ student.student_name }}">
                            </div>
                        </div>

                        <!-- Department & Year of Study -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-7">
                                <label for="department_id" class="form-label">Department / Branch</label>
                                <select class="form-select" id="department_id" name="department_id">
                                    <option value="">-- Select Department --</option>
                                    {% for dept in departments %}
                                    <option value="{{ dept.department_id }}" {% if student.department_id == dept.department_id %}selected{% endif %}>
                                        {{ dept.department_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label for="year_of_study" class="form-label">Year of Study</label>
                                <select class="form-select" id="year_of_study" name="year_of_study">
                                    <option value="1" {% if student.year_of_study == 1 %}selected{% endif %}>1st Year (Freshman)</option>
                                    <option value="2" {% if student.year_of_study == 2 %}selected{% endif %}>2nd Year (Sophomore)</option>
                                    <option value="3" {% if student.year_of_study == 3 %}selected{% endif %}>3rd Year (Junior)</option>
                                    <option value="4" {% if student.year_of_study == 4 %}selected{% endif %}>4th Year (Senior)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Email & Phone -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="email" class="form-label">College / Personal Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ student.email or '' }}">
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ student.phone or '' }}">
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex align-items-center gap-2 pt-2 border-top">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Update Student Details
                            </button>
                            <a href="{{ url_for('list_students') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
